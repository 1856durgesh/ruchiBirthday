<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Ruchi 🎂</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="fireCrack.css">
</head>
<body>
    <h1>🎉 Let's celiberate the birthday togeather 🎂</h1>
    
    <div class="cake-container">
        <div class="cake" id="cake">
            <div class="cake-left"></div>
            <div class="cake-right"></div>
            <div class="candle" id="candle">
                <div id="flame"></div>
            </div>
        </div>
        <p>Use the buttons to celebrate 🎂</p>
        <div class="buttons">
            <button class="button" id="blowButton">Blow the Candle</button>
            <button class="button" id="cutButton">Cut the Cake</button>
        </div>
    </div>

    <div class="birthday-message" id="birthdayMessage">🎉 Happy Birthday My Dear! 🎈</div>
    <audio id="blowCandle" src="./song/man-blowing-candle-out-102026.mp3"></audio>
    <audio id="birthdaySong" src="./song/happy-birthday-254480.mp3"></audio>

    <div class="balloon-container" id="balloonContainer"></div>

    <script src="script.js"></script>
    <script src="fireCrack.js"></script>
</body>
</html>
